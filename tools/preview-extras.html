<!-- ============================================================
     Preview-only scaffolding. NOT part of the theme.

     Injected by tools/build_preview.py; it never ships to a store.
     Everything else in preview/index.html is the Liquid theme rendered
     exactly as Shopify would render it.

     Two things live here:
       - an in-page event log, so the funnel can be inspected without
         opening GA4. It wraps dataLayer.push transparently and still
         forwards to the real tag.
       - the ?debug=1 panel that displays it.
     ============================================================ -->
<style>
  .evpanel{
    position:fixed;right:12px;bottom:12px;z-index:400;
    width:min(340px,calc(100vw - 24px));
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
    background:rgba(10,9,9,.95);border:1px solid var(--cream-16);border-radius:6px;
    color:var(--cream);backdrop-filter:blur(10px);box-shadow:0 16px 44px rgba(0,0,0,.55);
  }
  .evpanel__head{
    display:flex;align-items:center;gap:8px;padding:8px 10px;
    border-bottom:1px solid var(--cream-16);cursor:pointer;
  }
  .evpanel__dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
  .evpanel__title{font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:10px}
  .evpanel__count{margin-left:auto;color:var(--muted)}
  .evpanel__list{max-height:230px;overflow:auto;margin:0;padding:4px 0;list-style:none}
  .evpanel.is-collapsed .evpanel__list,.evpanel.is-collapsed .evpanel__foot,
  .evpanel.is-collapsed .evpanel__state{display:none}
  /* The state block sits above the fold of the panel on a phone, because it is
     the part a device pass actually reads. */
  .evpanel__state{padding:6px 10px;border-top:1px solid var(--cream-16);
    display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:10px}
  .evpanel__srow{display:contents}
  .evpanel__skey{color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .evpanel__sval{color:var(--cream);word-break:break-all}
  .evpanel__sval[data-warn="1"]{color:#ff6b60;font-weight:700}
  .evpanel__item{padding:5px 10px;border-bottom:1px solid rgba(242,228,193,.06);display:flex;gap:8px}
  .evpanel__name{color:#7fd4a0;flex:none}
  .evpanel__meta{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .evpanel__foot{padding:6px 10px;border-top:1px solid var(--cream-16);color:var(--muted);font-size:10px}
  @media print{.evpanel{display:none}}
  /* Keep clear of the sticky buy bar on phones */
  @media (max-width:749px){
    .evpanel{bottom:calc(12px + 76px)}
    .evpanel__list{max-height:150px}
  }
</style>
<script>
  (function(){
    var log=[]; window.NINEBELOW_EVENT_LOG=log;
    var origPush=window.dataLayer.push.bind(window.dataLayer);
    window.dataLayer.push=function(){
      var args=Array.prototype.slice.call(arguments);
      args.forEach(function(a){
        if(a && a[0]==='event'){
          var rec={event:a[1],params:a[2]||{},t:new Date().toISOString()};
          log.push(rec);
          if(console.groupCollapsed){
            console.groupCollapsed('%c GA4 %c '+rec.event,
              'background:#1f8ab0;color:#e8eef2;border-radius:2px','color:#1f8ab0;font-weight:600');
            console.log(rec.params); console.groupEnd();
          }
          window.dispatchEvent(new CustomEvent('ninebelow:ga4',{detail:rec}));
        }
      });
      return origPush.apply(null,args);
    };
    /* Read from the theme rather than restated here. An earlier version of this
       line hardcoded `traffic_type=demo`, which stayed true only for as long as
       the theme sent that to everybody. */
    var t = window.NINEBELOW_TRAFFIC || {};
    console.info('%c Nine Below %c reporting live to G-LD8107WMV2 as '+
      (t.type||'?')+' traffic ('+(t.reason||'?')+'). Inspect NINEBELOW_EVENT_LOG.',
      'background:#0d1418;color:#e8eef2;padding:2px 6px;border-radius:2px','color:#8098a6');
  })();
</script>
<!--BODY-->
<script>
(function(){
  var params = new URLSearchParams(location.search);
  if (params.get('debug') !== '1') {
    console.info(
      '%c Nine Below %c Event inspector hidden. Add ?debug=1 to the URL to show it, ' +
      'or inspect NINEBELOW_EVENT_LOG directly.',
      'background:#0d1418;color:#e8eef2;padding:2px 6px;border-radius:2px',
      'color:#8098a6'
    );
    return;
  }

  var panel=document.createElement('div');
  panel.className='evpanel';
  panel.innerHTML=
    '<div class="evpanel__head"><span class="evpanel__dot"></span>'+
    '<span class="evpanel__title">GA4 events</span>'+
    '<span class="evpanel__count">0</span></div>'+
    '<ul class="evpanel__list"></ul>'+
    '<div class="evpanel__state" id="nb-state"></div>'+
    '<div class="evpanel__foot">Cart is mocked; GA4 is live. Tap the header to collapse.</div>';
  document.body.appendChild(panel);

  /* ---------------------------------------------------------------------
     On-device state readout.

     The event list alone is not enough to test on a phone: it shows the first
     three params of each event, which may or may not include the three things a
     device pass actually has to confirm — which channel was resolved, whether
     the in-app browser was detected, and which arm was assigned. There is no
     devtools on a phone, so if it is not on screen it cannot be checked.

     `visits` is the important one. In-app browsers may partition or clear
     storage between sessions. If they do, every visit re-buckets the visitor,
     one person can see arm A then arm B, and every result the framework
     produces is meaningless. A counter that resets to 1 on a repeat visit is
     that failure, visible instantly and without tooling.
     --------------------------------------------------------------------- */
  var VISIT_KEY = 'nb_diag_visits';
  var visits = 0, storageOk = true;
  try {
    visits = (parseInt(localStorage.getItem(VISIT_KEY), 10) || 0) + 1;
    localStorage.setItem(VISIT_KEY, String(visits));
    if (localStorage.getItem(VISIT_KEY) !== String(visits)) storageOk = false;
  } catch (e) { storageOk = false; }

  function renderState(){
    var root = document.documentElement;
    var ab = window.NINEBELOW_AB || {};
    var flow = window.NINEBELOW_FLOW || {};
    var traffic = window.NINEBELOW_TRAFFIC || {};
    var arms = Object.keys(ab.active || {})
      .filter(function(k){ return ab.active[k]; })
      .map(function(k){ return k + ':' + ab.active[k]; }).join(' ') || '(none)';
    var stored = [];
    try {
      ['nb_ab_v1','nb_age_ok','nb_utm','nb_consent_v2','nb_flow','nb_qa'].forEach(function(k){
        if (localStorage.getItem(k) !== null) stored.push(k.replace('nb_',''));
      });
    } catch (e) { stored = ['<blocked>']; }

    var rows = [
      ['channel',  root.getAttribute('data-channel') || '(none)'],
      ['webview',  root.getAttribute('data-webview') || 'no'],
      ['in-app',   flow.inApp ? 'yes' : 'no'],
      ['flow',     root.getAttribute('data-flow') || '(none)'],
      ['age',      root.getAttribute('data-age') || 'gated'],
      ['arms',     arms],
      ['visits',   storageOk ? String(visits) : 'STORAGE BLOCKED'],
      ['kept',     stored.join(' ') || '(nothing persisted)'],
      /* Opening this panel is itself a QA act, so ?debug=1 marks the visit
         internal and this row reads `internal / debug` on almost every run.
         That is the correct answer, not a stuck readout — add `&qa=0` to see
         the public path with the panel still open. */
      ['traffic',  (traffic.type || '?') + ' / ' + (traffic.reason || '?')],
      /* Last, because it is the longest row and the ones above it are what the
         pass reads at a glance. This one is for when they disagree.

         `webview` above is a verdict; this is the evidence behind it. The
         Facebook fragments are tested before Instagram's in landing-flow.liquid
         and Meta ships shared fragments across its apps, so `webview: fb` inside
         Instagram is a live possibility — and without the string that produced
         it there is no way to tell which fragment matched, on a device with no
         devtools. Finding that out and being unable to diagnose it costs a
         second phone session. */
      ['ua',       navigator.userAgent || '(none)']
    ];
    var el = document.getElementById('nb-state');
    if (!el) return;
    el.textContent = '';
    rows.forEach(function(r){
      var d = document.createElement('div');
      d.className = 'evpanel__srow';
      var k = document.createElement('span'); k.className='evpanel__skey'; k.textContent = r[0];
      var v = document.createElement('span'); v.className='evpanel__sval'; v.textContent = r[1];
      /* Only a genuine storage failure is flagged. Flagging visits === 1 would
         fire on every real first visit, and an indicator that cries wolf on the
         happy path is one the tester stops reading. What matters is whether the
         number GOES UP on reload — which the page cannot know, so the test
         script asks for it instead. */
      if (r[0] === 'visits' && !storageOk) v.dataset.warn = '1';
      d.appendChild(k); d.appendChild(v); el.appendChild(d);
    });
  }

  var list=panel.querySelector('.evpanel__list');
  var count=panel.querySelector('.evpanel__count');
  var n=0;

  panel.querySelector('.evpanel__head').addEventListener('click',function(){
    panel.classList.toggle('is-collapsed');
  });

  renderState();
  setInterval(renderState, 1500);   // the gate and the arms settle after load

  window.addEventListener('ninebelow:ga4',function(e){
    n++; count.textContent=n;
    renderState();
    var keys=Object.keys(e.detail.params||{}).filter(function(k){return k!=='items'});
    var meta=keys.slice(0,3).map(function(k){
      var v=e.detail.params[k];
      return k+'='+(typeof v==='object'?'{…}':String(v).slice(0,18));
    }).join(' ');
    var li=document.createElement('li');
    li.className='evpanel__item';
    li.innerHTML='<span class="evpanel__name"></span><span class="evpanel__meta"></span>';
    li.querySelector('.evpanel__name').textContent=e.detail.event;
    li.querySelector('.evpanel__meta').textContent=meta;
    list.insertBefore(li,list.firstChild);
    while(list.children.length>60) list.removeChild(list.lastChild);
  });
})();
</script>
